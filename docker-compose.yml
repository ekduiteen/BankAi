services:
  db:
    image: postgres:15-alpine
    container_name: bankai-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bankai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: bankai-qdrant
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: bankai-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  backend:
    build: ./backend
    container_name: bankai-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bankai}
      - QDRANT_HOST=qdrant
      - MINIO_ENDPOINT=minio:9000
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: bankai-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: bankai-nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    environment:
      - NGINX_HOST=_
      - NGINX_PORT=80

  ollama:
    image: ollama/ollama:latest
    container_name: bankai-ollama
    restart: always
    ports:
      - "11434:11434"

  vllm-a:
    image: vllm/vllm-openai:latest
    container_name: bankai-vllm-a
    restart: always
    entrypoint: /bin/bash
    command:
      - -c
      - "vllm serve /data/models/qwen2.5-awq --host 0.0.0.0 --port 8000 --gpu-memory-utilization 0.40 --max-model-len 4096 --max-num-seqs 16 --served-model-name qwen2.5-7b --enable-prefix-caching"
    volumes:
      - /data:/data
    ports:
      - "8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vllm-b:
    image: vllm/vllm-openai:latest
    container_name: bankai-vllm-b
    restart: always
    entrypoint: /bin/bash
    command:
      - -c
      - "vllm serve /data/models/llm/gemma-4-E4B-it --host 0.0.0.0 --port 8000 --gpu-memory-utilization 0.45 --max-model-len 8192 --max-num-seqs 16 --served-model-name gemma-4 --enable-prefix-caching"
    volumes:
      - /data:/data
    ports:
      - "8002:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
