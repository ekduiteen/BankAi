services:
  db:
    image: postgres:15-alpine
    container_name: lipicore-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lipicore}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: lipicore-qdrant
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: lipicore-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  backend:
    build: ./backend
    container_name: lipicore-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bankai}
      - QDRANT_HOST=qdrant
      - MINIO_ENDPOINT=minio:9000
      # LLM routing — overrides .env so git is the source of truth
      - LLM_A_API_BASE=http://lipicore-vllm-b:8000
      - LLM_A_MODEL=lipi-llm
      - LLM_A_API_KEY=no-key
      - LLM_B_API_BASE=http://lipicore-vllm-b:8000
      - LLM_B_MODEL=lipi-llm
      - LLM_B_API_KEY=no-key
      - LLM_C_API_BASE=http://lipicore-vllm-c:8000
      - LLM_C_MODEL=gemma-4-26b-4bit
      - LLM_C_API_KEY=no-key
      - LLM_D_API_BASE=http://lipicore-vllm-d:8000
      - LLM_D_MODEL=qwen3.6-27b-4bit
      - LLM_D_API_KEY=no-key
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: lipicore-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: lipicore-nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    environment:
      - NGINX_HOST=_
      - NGINX_PORT=80

  ollama:
    image: ollama/ollama:latest
    container_name: lipicore-ollama
    restart: always
    ports:
      - "11434:11434"

  vllm-b:
    image: vllm/vllm-openai:latest
    container_name: lipicore-vllm-b
    restart: always
    entrypoint: /bin/bash
    command:
      - -c
      - "vllm serve /data/models/llm/gemma-4-E4B-it --host 0.0.0.0 --port 8000 --gpu-memory-utilization 0.45 --max-model-len 4096 --max-num-seqs 16 --served-model-name gemma-4 --enable-prefix-caching --enable-lora --max-lora-rank 16 --lora-modules lipi-llm=/data/projects/lipi-llm/adapters/LipiLLM-Fast-4B-v0.1"
    volumes:
      - /data:/data
    ports:
      - "8002:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vllm-c:
    image: vllm/vllm-openai:latest
    container_name: lipicore-vllm-c
    restart: 'no'
    entrypoint: /bin/bash
    command:
      - -c
      - "echo 'vllm-c disabled - GPU memory insufficient for both 4B and 26B models'; sleep infinity"
    volumes:
      - /data:/data
    ports:
      - "8003:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vllm-d:
    image: vllm/vllm-openai:latest
    container_name: lipicore-vllm-d
    restart: 'no'
    entrypoint: /bin/bash
    command:
      - -c
      - "echo 'vllm-d disabled - only Gemma models in use'; sleep infinity"
    volumes:
      - /data:/data
    ports:
      - "8004:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
